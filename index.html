<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor-principal">
        <!-- Sección Izquierda: Formulario de Conversión -->
        <section class="tarjeta conversor">
            <h1>💱 Conversor de Divisas</h1>

            <div class="panel-conversor">
                <div class="grupo-entrada">
                    <label for="monto">Monto a convertir:</label>
                    <input type="number" id="monto" value="1000" min="0" placeholder="Ingresa el monto">
                </div>

                <div class="fila-selectores">
                    <div class="grupo-selector">
                        <label for="moneda-origen">Desde:</label>
                        <select id="moneda-origen">
                            <option value="ARS" selected>🇦🇷 ARS - Peso Argentino</option>
                            <option value="USD">🇺🇸 USD - Dólar</option>
                            <option value="EUR">🇪🇺 EUR - Euro</option>
                            <option value="GBP">🇬🇧 GBP - Libra</option>
                            <option value="BRL">🇧🇷 BRL - Real</option>
                        </select>
                    </div>

                    <button type="button" id="btn-intercambiar" class="btn-swap" title="Intercambiar">⇄</button>

                    <div class="grupo-selector">
                        <label for="moneda-destino">Hacia:</label>
                        <select id="moneda-destino">
                            <option value="USD" selected>🇺🇸 USD - Dólar</option>
                            <option value="ARS">🇦🇷 ARS - Peso Argentino</option>
                            <option value="EUR">🇪🇺 EUR - Euro</option>
                            <option value="GBP">🇬🇧 GBP - Libra</option>
                            <option value="BRL">🇧🇷 BRL - Real</option>
                        </select>
                    </div>
                </div>

                <button type="button" id="btn-convertir" class="btn-principal">Convertir y Crear Pegatina ✨</button>

                <div class="caja-resultado">
                    <h2>RESULTADO</h2>
                    <div class="info-conversion">
                        <p id="resultado-texto">0 ARS = 0 USD</p>
                        <span id="tipo-cambio-texto">Cargando...</span>
                    </div>
                    <p class="nota-subtitulo">El resultado se agrega automáticamente como una nueva pegatina ✨</p>
                </div>
            </div>
        </section>

        <!-- Sección Derecha: Sistema de Pegatinas -->
        <section class="tarjeta pegatinas">
            <div class="encabezado-pegatinas">
                <h2>🎟️ Sistema de Pegatinas</h2>
                <p>Tus conversiones se guardan aquí como pegatinas coleccionables.</p>
                <button type="button" id="btn-limpiar" class="btn-secundario">Limpiar Historial</button>
            </div>

            <div id="grid-pegatinas" class="grid-pegatinas"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
