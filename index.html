<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor-principal">
        
        <!-- Sección Conversor -->
        <section class="tarjeta conversor">
            <h1>💱 Conversor de Divisas</h1>

            <div class="layout-conversor">
                <!-- Columna Izquierda: Formulario -->
                <div class="columna-formulario">
                    <div class="grupo-campo">
                        <label for="monto">Monto</label>
                        <input type="number" id="monto" value="1000">
                    </div>

                    <div class="fila-selectores">
                        <div class="grupo-campo">
                            <label for="moneda-origen">Desde</label>
                            <select id="moneda-origen">
                                <option value="ARS">🇦🇷 ARS - Peso Argentino</option>
                            </select>
                        </div>

                        <button type="button" id="btn-intercambiar" class="btn-swap">⇄</button>

                        <div class="grupo-campo">
                            <label for="moneda-destino">Hacia</label>
                            <select id="moneda-destino">
                                <option value="USD">🇺🇸 USD - Dólar</option>
                            </select>
                        </div>
                    </div>

                    <button type="button" id="btn-convertir" class="btn-convertir">CONVERTIR</button>
                </div>

                <!-- Columna Derecha: Resultado -->
                <div class="columna-resultado">
                    <h2 class="titulo-resultado">RESULTADO</h2>
                    <div class="caja-verde">
                        <p id="resultado-texto" class="texto-principal">1.000 ARS = 0,75 USD</p>
                        <span id="tipo-cambio-texto" class="texto-secundario">Tipo de cambio: 1 USD = 1.333,33 ARS</span>
                    </div>
                    <p class="nota-pegatina">El resultado se agrega automáticamente como una nueva pegatina ✨</p>
                </div>
            </div>
        </section>

        <!-- Sección Pegatinas -->
        <section class="tarjeta pegatinas">
            <div class="encabezado-pegatinas">
                <div>
                    <h2>🎟️ Sistema de Pegatinas</h2>
                    <p>Tus conversiones se guardan aquí como pegatinas coleccionables.</p>
                </div>
                <button type="button" id="btn-limpiar" class="btn-borrar">🗑️ Borrar todo</button>
            </div>

            <div id="grid-pegatinas" class="grid-pegatinas">
                <!-- Las pegatinas se generan con JS -->
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
